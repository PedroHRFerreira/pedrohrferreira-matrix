name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-production
      url: https://pedrohrferreira.com
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable) in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Publish production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: pages deploy out --project-name=pedrohrferreira --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production domains
        run: |
          for domain in pedrohrferreira.com www.pedrohrferreira.com; do
            verified=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 \
                "https://$domain" --output "$RUNNER_TEMP/cloudflare-index.html" \
                && cmp --silent out/index.html "$RUNNER_TEMP/cloudflare-index.html"; then
                verified=true
                break
              fi
              sleep 5
            done
            if [[ "$verified" != true ]]; then
              echo "::error::$domain is not serving this build after deployment."
              exit 1
            fi
          done
          curl --fail --silent --show-error --location --head --max-time 20 \
            --retry 3 --retry-all-errors --retry-delay 3 \
            https://pedrohrferreira.com/curriculo-pedro.pdf > /dev/null
          printf 'Production verified: https://pedrohrferreira.com (commit %s).\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
